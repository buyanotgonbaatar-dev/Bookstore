<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ — НОМдэлгүүр</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1a1209; --gold:#c9963a; --rust:#9b3a1a; --cream:#fdf8f0;
    --parchment:#f5efe3; --sage:#4a5e4a; --err:#c0392b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Crimson Text',serif;background:#111;color:#eee;min-height:100vh}

  /* LOGIN */
  #loginScreen {
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--ink);
  }
  .login-box {
    background:#2a1f10;border:2px solid var(--gold);padding:3rem;
    width:360px;text-align:center;
  }
  .login-box h1 { font-family:'Playfair Display',serif;color:var(--gold);font-size:2rem;margin-bottom:.3rem; }
  .login-box p { color:#b8a98a;font-style:italic;margin-bottom:2rem; }
  .login-box input {
    width:100%;padding:.85rem 1rem;margin-bottom:1rem;
    background:#1a1209;border:1.5px solid #4a3a20;color:#eee;
    font-family:'Crimson Text',serif;font-size:1rem;outline:none;
  }
  .login-box input:focus { border-color:var(--gold); }
  .login-btn {
    width:100%;padding:.9rem;background:var(--gold);color:var(--ink);
    border:none;font-family:'Playfair Display',serif;font-size:1.05rem;
    font-weight:700;cursor:pointer;transition:background .2s;
  }
  .login-btn:hover { background:#e0aa45; }
  .login-err { color:var(--err);margin-top:.8rem;font-size:.95rem;display:none; }

  /* ADMIN */
  #adminScreen { display:none; }

  .admin-nav {
    background:var(--ink);padding:0 2rem;display:flex;align-items:center;
    justify-content:space-between;height:60px;border-bottom:3px solid var(--gold);
    position:sticky;top:0;z-index:100;
  }
  .admin-nav h1 { font-family:'Playfair Display',serif;color:var(--gold);font-size:1.3rem; }
  .admin-nav span { color:#b8a98a;font-size:.9rem; }
  .logout-btn {
    background:transparent;border:1.5px solid var(--rust);color:var(--rust);
    padding:.4rem 1rem;font-family:'Crimson Text',serif;font-size:.95rem;cursor:pointer;
    transition:all .2s;
  }
  .logout-btn:hover { background:var(--rust);color:white; }

  .admin-body { max-width:1100px;margin:0 auto;padding:2rem; }

  .stats { display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;margin-bottom:2.5rem; }
  .stat-card { background:#1a1209;border:1px solid #3a2a10;padding:1.5rem;border-left:4px solid var(--gold); }
  .stat-card .num { font-family:'Playfair Display',serif;font-size:2.2rem;color:var(--gold); }
  .stat-card .lbl { color:#9a8a6a;font-size:.9rem;margin-top:.3rem; }

  .section-header {
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:1.5rem;padding-bottom:.8rem;border-bottom:2px solid #3a2a10;
  }
  .section-header h2 { font-family:'Playfair Display',serif;color:var(--gold);font-size:1.5rem; }

  .add-btn-main {
    background:var(--sage);color:white;border:none;padding:.6rem 1.4rem;
    font-family:'Crimson Text',serif;font-size:1rem;cursor:pointer;
    transition:background .2s;display:flex;align-items:center;gap:.4rem;
  }
  .add-btn-main:hover { background:#3a4e3a; }

  /* MODAL */
  .modal-overlay {
    position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;
    display:none;align-items:center;justify-content:center;
  }
  .modal-overlay.open { display:flex; }
  .modal {
    background:#1a1209;border:2px solid var(--gold);padding:2.5rem;
    width:500px;max-width:95vw;max-height:90vh;overflow-y:auto;
  }
  .modal h2 { font-family:'Playfair Display',serif;color:var(--gold);margin-bottom:1.5rem; }
  .form-row { margin-bottom:1.2rem; }
  .form-row label { display:block;color:#b8a98a;font-size:.9rem;margin-bottom:.4rem;letter-spacing:.05em;text-transform:uppercase; }
  .form-row input, .form-row select {
    width:100%;padding:.75rem 1rem;background:#0d0a06;border:1.5px solid #3a2a10;
    color:#eee;font-family:'Crimson Text',serif;font-size:1rem;outline:none;
  }
  .form-row input:focus, .form-row select:focus { border-color:var(--gold); }
  .form-row select option { background:#1a1209; }
  .form-2col { display:grid;grid-template-columns:1fr 1fr;gap:1rem; }
  .modal-btns { display:flex;gap:1rem;margin-top:1.5rem; }
  .save-btn {
    flex:1;padding:.85rem;background:var(--gold);color:var(--ink);border:none;
    font-family:'Playfair Display',serif;font-weight:700;font-size:1rem;cursor:pointer;
  }
  .save-btn:hover { background:#e0aa45; }
  .cancel-btn {
    padding:.85rem 1.5rem;background:transparent;border:1.5px solid #4a3a20;
    color:#b8a98a;font-family:'Crimson Text',serif;font-size:1rem;cursor:pointer;
  }
  .cancel-btn:hover { border-color:var(--rust);color:var(--rust); }

  /* COLOR PICKER */
  .color-picker { display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.5rem; }
  .color-opt {
    width:32px;height:32px;border-radius:3px;cursor:pointer;border:2px solid transparent;
    transition:transform .2s;
  }
  .color-opt:hover { transform:scale(1.1); }
  .color-opt.selected { border-color:white;transform:scale(1.15); }
  .col-c1{background:linear-gradient(135deg,#7b2d2d,#c0392b)}
  .col-c2{background:linear-gradient(135deg,#1a3a5c,#2980b9)}
  .col-c3{background:linear-gradient(135deg,#2d5a3d,#27ae60)}
  .col-c4{background:linear-gradient(135deg,#5a2d7b,#8e44ad)}
  .col-c5{background:linear-gradient(135deg,#7b5a2d,#e67e22)}
  .col-c6{background:linear-gradient(135deg,#1a1a2e,#16213e)}
  .col-c7{background:linear-gradient(135deg,#2c3e50,#4ca1af)}
  .col-c8{background:linear-gradient(135deg,#833ab4,#fd1d1d)}

  /* BOOKS TABLE */
  .books-table { width:100%;border-collapse:collapse; }
  .books-table th {
    background:#0d0a06;color:var(--gold);text-align:left;
    padding:.8rem 1rem;font-family:'Playfair Display',serif;font-size:.95rem;
    border-bottom:2px solid #3a2a10;letter-spacing:.05em;
  }
  .books-table td {
    padding:.9rem 1rem;border-bottom:1px solid #2a1a08;
    vertical-align:middle;font-size:.95rem;color:#d4c4a0;
  }
  .books-table tr:hover td { background:#1f1508; }
  .book-mini { display:flex;align-items:center;gap:.8rem; }
  .mini-cover { width:32px;height:46px;border-radius:1px 4px 4px 1px;flex-shrink:0; }
  .book-mini strong { color:#eee;font-family:'Playfair Display',serif;font-size:.95rem; }
  .book-mini span { color:#9a8a6a;font-size:.82rem;font-style:italic; }
  .badge-sm {
    display:inline-block;padding:.15rem .5rem;font-size:.7rem;font-weight:600;
    letter-spacing:.08em;text-transform:uppercase;
  }
  .badge-best{background:var(--rust);color:white}
  .badge-new{background:var(--sage);color:white}
  .badge-none{background:#333;color:#999}
  .action-btns { display:flex;gap:.5rem; }
  .edit-btn {
    background:transparent;border:1px solid var(--gold);color:var(--gold);
    padding:.3rem .7rem;cursor:pointer;font-size:.85rem;transition:all .2s;
  }
  .edit-btn:hover { background:var(--gold);color:var(--ink); }
  .del-btn {
    background:transparent;border:1px solid var(--err);color:var(--err);
    padding:.3rem .7rem;cursor:pointer;font-size:.85rem;transition:all .2s;
  }
  .del-btn:hover { background:var(--err);color:white; }

  /* TOAST */
  .toast { position:fixed;bottom:2rem;right:2rem;background:var(--sage);color:white;padding:1rem 1.5rem;font-family:'Crimson Text',serif;font-size:1rem;border-left:4px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.4);transform:translateX(120%);transition:transform .3s;z-index:999; }
  .toast.show { transform:translateX(0); }

  @media(max-width:600px){
    .stats{grid-template-columns:1fr}
    .form-2col{grid-template-columns:1fr}
    .books-table thead{display:none}
    .books-table td{display:block;padding:.5rem 1rem}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>🔐 Админ</h1>
    <p>НОМдэлгүүр удирдлагын панел</p>
    <input type="text" id="loginUser" placeholder="Хэрэглэгчийн нэр">
    <input type="password" id="loginPass" placeholder="Нууц үг" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Нэвтрэх</button>
    <div class="login-err" id="loginErr">Хэрэглэгчийн нэр эсвэл нууц үг буруу!</div>
    <p style="margin-top:1.5rem;color:#5a4a32;font-size:.85rem">Анхдагч: admin / 1234</p>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminScreen">
  <div class="admin-nav">
    <h1>📚 НОМдэлгүүр — Админ</h1>
    <span id="welcomeMsg"></span>
    <div style="display:flex;gap:1rem;align-items:center">
      <a href="index.html" target="_blank" style="color:var(--gold);font-size:.9rem">Дэлгүүр харах →</a>
      <button class="logout-btn" onclick="doLogout()">Гарах</button>
    </div>
  </div>

  <div class="admin-body">
    <!-- STATS -->
    <div class="stats">
      <div class="stat-card">
        <div class="num" id="statTotal">0</div>
        <div class="lbl">Нийт ном</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statCheap">0</div>
        <div class="lbl">₮20,000-аас доош</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statNew">0</div>
        <div class="lbl">Шинэ номууд</div>
      </div>
    </div>

    <!-- TABLE -->
    <div class="section-header">
      <h2>Номын жагсаалт</h2>
      <button class="add-btn-main" onclick="openModal()">＋ Ном нэмэх</button>
    </div>

    <table class="books-table">
      <thead>
        <tr>
          <th>Ном</th>
          <th>Ангилал</th>
          <th>Үнэ</th>
          <th>Одор</th>
          <th>Тэмдэглэл</th>
          <th>Үйлдэл</th>
        </tr>
      </thead>
      <tbody id="booksTableBody"></tbody>
    </table>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Ном нэмэх</h2>
    <input type="hidden" id="editId">
    <div class="form-row">
      <label>Номын нэр</label>
      <input type="text" id="fTitle" placeholder="жнь: Монголын Нууц Товчоо">
    </div>
    <div class="form-row">
      <label>Зохиогч</label>
      <input type="text" id="fAuthor" placeholder="жнь: Д. Нямаа">
    </div>
    <div class="form-row">
      <label>Ангилал</label>
      <select id="fCat">
        <option value="mongol">Монгол зохиол</option>
        <option value="uran">Уран зохиол</option>
        <option value="tuuh">Түүх</option>
        <option value="erdem">Эрдэм шинжилгээ</option>
        <option value="huu">Хүүхдийн</option>
      </select>
    </div>
    <div class="form-2col">
      <div class="form-row">
        <label>Үнэ (₮)</label>
        <input type="number" id="fPrice" placeholder="25000">
      </div>
      <div class="form-row">
        <label>Хуучин үнэ (₮)</label>
        <input type="number" id="fOldPrice" placeholder="0 = байхгүй">
      </div>
    </div>
    <div class="form-2col">
      <div class="form-row">
        <label>Одор (1-5)</label>
        <input type="number" id="fStars" min="1" max="5" placeholder="5">
      </div>
      <div class="form-row">
        <label>Тэмдэглэл</label>
        <select id="fBadge">
          <option value="">Байхгүй</option>
          <option value="Шинэ">Шинэ</option>
          <option value="Шилдэг">Шилдэг</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <label>Номын өнгө</label>
      <div class="color-picker" id="colorPicker">
        <div class="color-opt col-c1 selected" data-c="c1" onclick="selectColor(this)"></div>
        <div class="color-opt col-c2" data-c="c2" onclick="selectColor(this)"></div>
        <div class="color-opt col-c3" data-c="c3" onclick="selectColor(this)"></div>
        <div class="color-opt col-c4" data-c="c4" onclick="selectColor(this)"></div>
        <div class="color-opt col-c5" data-c="c5" onclick="selectColor(this)"></div>
        <div class="color-opt col-c6" data-c="c6" onclick="selectColor(this)"></div>
        <div class="color-opt col-c7" data-c="c7" onclick="selectColor(this)"></div>
        <div class="color-opt col-c8" data-c="c8" onclick="selectColor(this)"></div>
      </div>
    </div>
    <div class="modal-btns">
      <button class="cancel-btn" onclick="closeModal()">Болих</button>
      <button class="save-btn" onclick="saveBook()">Хадгалах</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- AUTH ----
const ADMIN_USER = 'admin';
const ADMIN_PASS = '1234';

function doLogin() {
  const u = document.getElementById('loginUser').value;
  const p = document.getElementById('loginPass').value;
  if (u === ADMIN_USER && p === ADMIN_PASS) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminScreen').style.display = 'block';
    document.getElementById('welcomeMsg').textContent = 'Сайн байна уу, ' + u + '!';
    renderTable();
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
}

function doLogout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminScreen').style.display = 'none';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
}

// ---- DATA ----
const DEFAULT_BOOKS = [
  {id:1,title:'Монголын Нууц Товчоо',author:'Арди зохиол',genre:'mongol',cat:'mongol',price:25000,oldPrice:32000,badge:'Шилдэг',stars:5,reviews:128,color:'c1'},
  {id:2,title:'Гурван Замын Уулзвар',author:'Б. Явуухулан',genre:'uran',cat:'uran',price:18000,oldPrice:0,badge:'Шинэ',stars:4,reviews:87,color:'c2'},
  {id:3,title:'Чингис Хааны Түүх',author:'Д. Мягмар',genre:'tuuh',cat:'tuuh',price:22000,oldPrice:28000,badge:'',stars:5,reviews:214,color:'c3'},
  {id:4,title:'Оюун Ухааны Гүн',author:'С. Пүрэвдорж',genre:'erdem',cat:'erdem',price:28000,oldPrice:0,badge:'Шинэ',stars:4,reviews:43,color:'c4'},
  {id:5,title:'Аав Аавдаа Захидал',author:'Г. Аюурзана',genre:'huu',cat:'huu',price:12000,oldPrice:15000,badge:'',stars:5,reviews:96,color:'c5'},
  {id:6,title:'Цөлийн Цэцэг',author:'Д. Нямаа',genre:'uran',cat:'uran',price:16000,oldPrice:0,badge:'Шилдэг',stars:4,reviews:61,color:'c6'},
  {id:7,title:'Нүүдэлчдийн Нийгэм',author:'Б. Энхтөр',genre:'tuuh',cat:'tuuh',price:20000,oldPrice:25000,badge:'',stars:5,reviews:75,color:'c7'},
  {id:8,title:'Хөх Тэнгэрийн Доор',author:'Ч. Лодойдамба',genre:'mongol',cat:'mongol',price:19000,oldPrice:0,badge:'Шинэ',stars:5,reviews:183,color:'c8'},
];

function getBooks() {
  const s = localStorage.getItem('nom_books');
  return s ? JSON.parse(s) : DEFAULT_BOOKS;
}
function saveBooks(books) {
  localStorage.setItem('nom_books', JSON.stringify(books));
}
function nextId(books) {
  return books.length ? Math.max(...books.map(b=>b.id)) + 1 : 1;
}

// ---- TABLE ----
const CAT_LABELS = {mongol:'Монгол зохиол',uran:'Уран зохиол',tuuh:'Түүх',erdem:'Эрдэм шинжилгээ',huu:'Хүүхдийн'};

function renderTable() {
  const books = getBooks();
  document.getElementById('statTotal').textContent = books.length;
  document.getElementById('statCheap').textContent = books.filter(b=>b.price<20000).length;
  document.getElementById('statNew').textContent = books.filter(b=>b.badge==='Шинэ').length;

  const tbody = document.getElementById('booksTableBody');
  tbody.innerHTML = books.map(b => `
    <tr>
      <td>
        <div class="book-mini">
          <div class="mini-cover col-${b.color||'c1'}"></div>
          <div>
            <strong>${b.title}</strong><br>
            <span>${b.author}</span>
          </div>
        </div>
      </td>
      <td>${CAT_LABELS[b.cat]||b.cat}</td>
      <td>₮${b.price.toLocaleString()}${b.oldPrice?`<br><span style="text-decoration:line-through;color:#666;font-size:.8rem">₮${b.oldPrice.toLocaleString()}</span>`:''}</td>
      <td>${'★'.repeat(b.stars)+'☆'.repeat(5-b.stars)}</td>
      <td><span class="badge-sm badge-${b.badge==='Шинэ'?'new':b.badge==='Шилдэг'?'best':'none'}">${b.badge||'—'}</span></td>
      <td>
        <div class="action-btns">
          <button class="edit-btn" onclick="openModal(${b.id})">✏️ Засах</button>
          <button class="del-btn" onclick="deleteBook(${b.id})">🗑 Устгах</button>
        </div>
      </td>
    </tr>
  `).join('');
}

// ---- MODAL ----
let selectedColor = 'c1';

function selectColor(el) {
  document.querySelectorAll('.color-opt').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
  selectedColor = el.dataset.c;
}

function openModal(id) {
  document.getElementById('modalOverlay').classList.add('open');
  if (id) {
    const b = getBooks().find(x=>x.id===id);
    document.getElementById('modalTitle').textContent = 'Ном засах';
    document.getElementById('editId').value = id;
    document.getElementById('fTitle').value = b.title;
    document.getElementById('fAuthor').value = b.author;
    document.getElementById('fCat').value = b.cat;
    document.getElementById('fPrice').value = b.price;
    document.getElementById('fOldPrice').value = b.oldPrice||0;
    document.getElementById('fStars').value = b.stars;
    document.getElementById('fBadge').value = b.badge||'';
    selectedColor = b.color||'c1';
    document.querySelectorAll('.color-opt').forEach(e=>{
      e.classList.toggle('selected', e.dataset.c===selectedColor);
    });
  } else {
    document.getElementById('modalTitle').textContent = 'Ном нэмэх';
    document.getElementById('editId').value = '';
    document.getElementById('fTitle').value='';
    document.getElementById('fAuthor').value='';
    document.getElementById('fCat').value='mongol';
    document.getElementById('fPrice').value='';
    document.getElementById('fOldPrice').value='0';
    document.getElementById('fStars').value='5';
    document.getElementById('fBadge').value='';
    selectedColor='c1';
    document.querySelectorAll('.color-opt').forEach(e=>e.classList.toggle('selected',e.dataset.c==='c1'));
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function saveBook() {
  const title = document.getElementById('fTitle').value.trim();
  const author = document.getElementById('fAuthor').value.trim();
  const price = parseInt(document.getElementById('fPrice').value)||0;
  if (!title || !author || !price) { showToast('Бүх талбарыг бөглөнө үү!'); return; }

  const books = getBooks();
  const editId = document.getElementById('editId').value;
  const book = {
    title, author,
    cat: document.getElementById('fCat').value,
    genre: document.getElementById('fCat').value,
    price,
    oldPrice: parseInt(document.getElementById('fOldPrice').value)||0,
    stars: parseInt(document.getElementById('fStars').value)||5,
    badge: document.getElementById('fBadge').value,
    color: selectedColor,
    reviews: 0,
  };

  if (editId) {
    const idx = books.findIndex(b=>b.id==editId);
    book.id = parseInt(editId);
    book.reviews = books[idx].reviews;
    books[idx] = book;
    showToast('✓ Ном амжилттай засагдлаа!');
  } else {
    book.id = nextId(books);
    books.push(book);
    showToast('✓ Ном амжилттай нэмэгдлээ!');
  }

  saveBooks(books);
  renderTable();
  closeModal();
}

function deleteBook(id) {
  if (!confirm('Энэ номыг устгах уу?')) return;
  const books = getBooks().filter(b=>b.id!==id);
  saveBooks(books);
  renderTable();
  showToast('🗑 Ном устгагдлаа');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e){
  if (e.target === this) closeModal();
});
</script>
</body>
</html>
